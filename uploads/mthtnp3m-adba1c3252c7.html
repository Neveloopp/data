<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>My game</title>
<style>
:root{--bg:#070711;--panel:#111126;--panel2:#171735;--border:#30306a;--gold:#f4c84a;--cyan:#4ee0d0;--red:#ff6577;--green:#55e38d;--blue:#61a8ff;--purple:#b879ff;--text:#f5f7ff;--muted:#9da2c6}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;user-select:none}
html,body{width:100%;min-height:100%;background:radial-gradient(circle at top,#151538 0,#090914 45%,#05050b 100%);color:var(--text);font-family:Inter,Segoe UI,system-ui,sans-serif}
body{overflow-x:hidden}
button,input,select{font:inherit}
button{cursor:pointer}
.app{width:min(1180px,100%);margin:auto;min-height:100vh;padding:14px}
.header{display:flex;gap:12px;align-items:center;justify-content:space-between;flex-wrap:wrap;margin-bottom:14px}
.brand{display:flex;align-items:center;gap:10px}
.logo{width:48px;height:48px;border-radius:16px;display:grid;place-items:center;background:linear-gradient(135deg,#26265a,#14142e);border:1px solid #44449a;box-shadow:0 0 24px #6256ff44;font-size:26px}
.brand h1{font-size:clamp(20px,5vw,34px);color:var(--gold);letter-spacing:.5px}
.brand p{font-size:12px;color:var(--muted)}
.head-actions{display:flex;gap:8px;flex-wrap:wrap}
.btn{border:1px solid var(--border);background:#1a1a3a;color:#e7e9ff;border-radius:12px;padding:10px 14px;font-weight:800;min-height:42px}
.btn:hover,.btn:active{border-color:var(--gold);color:var(--gold);transform:translateY(-1px)}
.btn.primary{background:linear-gradient(135deg,#4e42c9,#763ed0);border-color:#8f7cff;color:#fff}
.btn.danger{background:#361421;border-color:#6e263b;color:#ff9aaa}
.screen{display:none}.screen.active{display:block}
.hero{background:linear-gradient(145deg,#17173a,#101022);border:1px solid #2d2d67;border-radius:22px;padding:18px;margin-bottom:14px;box-shadow:0 18px 50px #0007}
.hero h2{font-size:clamp(22px,5vw,40px);margin-bottom:6px}.hero p{color:var(--muted);line-height:1.45}
.mode-strip{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:14px}
.mode{background:#101026;border:1px solid #30306a;border-radius:15px;padding:12px;color:#cfd2ef;font-weight:900;text-align:center}.mode.active{border-color:var(--gold);box-shadow:0 0 18px #f4c84a26;color:var(--gold);background:#242039}
.tools{display:flex;gap:8px;flex-wrap:wrap;margin:14px 0}.search{flex:1;min-width:180px;background:#0d0d20;border:1px solid var(--border);color:#fff;border-radius:13px;padding:12px 14px;outline:none}.search:focus{border-color:var(--cyan)}
.filters{display:flex;gap:7px;flex-wrap:wrap}.chip{border:1px solid #2f2f67;background:#11112a;color:#aeb3da;border-radius:999px;padding:9px 12px;font-size:12px;font-weight:800}.chip.active{color:#101018;background:var(--gold);border-color:var(--gold)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(165px,1fr));gap:10px}.card{border:1px solid #2a2a5d;background:linear-gradient(160deg,#171735,#0f0f24);border-radius:18px;padding:14px;min-height:145px;display:flex;flex-direction:column;gap:7px;transition:.15s;position:relative;overflow:hidden}.card:hover{transform:translateY(-3px);border-color:#5d58bb;box-shadow:0 14px 32px #0006}.card .num{position:absolute;right:10px;top:8px;color:#555a88;font-size:12px;font-weight:900}.card .ico{font-size:30px}.card h3{font-size:15px}.card p{font-size:11px;color:var(--muted);line-height:1.35;flex:1}.tag{font-size:10px;font-weight:900;color:var(--cyan);text-transform:uppercase;letter-spacing:.7px}.card button{width:100%;padding:8px;border-radius:10px;border:1px solid #353571;background:#202046;color:#fff;font-weight:800}
.game-shell{display:grid;grid-template-columns:260px 1fr;gap:12px}.side{background:#0e0e21;border:1px solid #2b2b60;border-radius:18px;padding:14px;height:max-content}.side h2{font-size:18px;color:var(--gold);margin:6px 0}.side p{font-size:12px;color:var(--muted);line-height:1.45}.scorebox{display:grid;grid-template-columns:1fr 1fr;gap:7px;margin-top:12px}.score{padding:10px;background:#151532;border:1px solid #2d2d65;border-radius:12px;text-align:center}.score b{display:block;font-size:20px}.score span{font-size:10px;color:var(--muted)}
.stage{background:#0d0d1f;border:1px solid #2c2c61;border-radius:20px;padding:14px;min-height:650px;display:flex;flex-direction:column}.stage-head{display:flex;align-items:center;justify-content:space-between;gap:8px;flex-wrap:wrap;margin-bottom:10px}.status{font-weight:900;color:var(--cyan)}.game-area{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;min-height:500px}
.panel{width:min(650px,100%);background:#12122d;border:1px solid #31316c;border-radius:18px;padding:14px}.panel h3{text-align:center;margin-bottom:10px}.choices{display:grid;grid-template-columns:repeat(2,1fr);gap:8px}.choice{padding:13px;background:#1a1a3c;border:1px solid #363677;border-radius:12px;color:#fff;font-weight:800}.choice.correct{border-color:var(--green);color:var(--green)}.choice.wrong{border-color:var(--red);color:var(--red)}
.board3{display:grid;grid-template-columns:repeat(3,minmax(72px,110px));gap:7px}.cell3{aspect-ratio:1;background:#17173a;border:1px solid #3a3a78;border-radius:15px;color:#fff;font-size:44px;font-weight:1000}
.connect{display:grid;grid-template-columns:repeat(7,clamp(36px,8vw,64px));gap:5px;background:#131344;padding:9px;border-radius:16px}.disc{aspect-ratio:1;border-radius:50%;background:#080817;border:2px solid #28286a}.disc.p1{background:var(--cyan)}.disc.p2{background:var(--red)}
.checkers{display:grid;grid-template-columns:repeat(8,clamp(34px,8.5vw,64px));border:3px solid #34346e}.sq{aspect-ratio:1;display:grid;place-items:center;background:#b9a986}.sq.dark{background:#43395f}.piece{width:72%;height:72%;border-radius:50%;border:3px solid #ffffff44;display:grid;place-items:center;font-size:18px}.piece.p1{background:var(--cyan)}.piece.p2{background:var(--red)}.piece.king:after{content:'♛';color:#fff}.sq.sel{outline:3px solid var(--gold);outline-offset:-3px}
.rps{display:flex;gap:8px;flex-wrap:wrap;justify-content:center}.rps button{font-size:44px;width:100px;height:100px;border-radius:20px;border:1px solid #3a3a79;background:#18183c}.big-result{font-size:clamp(24px,6vw,56px);font-weight:1000;text-align:center}
.nim{display:flex;flex-wrap:wrap;justify-content:center;gap:8px}.stone{width:42px;height:56px;border-radius:50% 50% 40% 40%;border:1px solid #9b84ff;background:linear-gradient(#7f6ce1,#40347f)}
.memory{display:grid;grid-template-columns:repeat(4,minmax(58px,90px));gap:7px}.mem{aspect-ratio:1;border:1px solid #3d3d7e;border-radius:13px;background:#1b1b42;color:#fff;font-size:28px;font-weight:900}.mem.hidden{color:transparent;background:linear-gradient(135deg,#332a72,#171738)}.mem.matched{opacity:.35}
.lights{display:grid;grid-template-columns:repeat(5,clamp(50px,12vw,80px));gap:6px}.light{aspect-ratio:1;border-radius:12px;border:1px solid #383875;background:#14142f}.light.on{background:#f4e24a;box-shadow:0 0 20px #f4e24a88}
.minegrid{display:grid;grid-template-columns:repeat(8,clamp(34px,9vw,55px));gap:3px}.mine{aspect-ratio:1;border:1px solid #35356e;background:#1c1c42;color:#fff;border-radius:7px;font-weight:900}.mine.open{background:#0d0d20}.mine.boom{background:#5b1728}
.g2048{display:grid;grid-template-columns:repeat(4,clamp(65px,17vw,100px));gap:7px;background:#17172f;padding:8px;border-radius:15px}.tile{aspect-ratio:1;background:#26264f;border-radius:10px;display:grid;place-items:center;font-size:22px;font-weight:1000}.tile.v0{opacity:.25}.tile.v4,.tile.v8{color:var(--gold)}.tile.v16,.tile.v32{color:var(--cyan)}.tile.v64,.tile.v128,.tile.v256{color:var(--red)}.tile.v512,.tile.v1024,.tile.v2048{color:var(--green)}
.canvasbox{width:min(620px,100%);display:flex;justify-content:center}.canvasbox canvas{max-width:100%;background:#080818;border:2px solid #30306c;border-radius:14px;touch-action:none}.dpad{display:grid;grid-template-columns:repeat(3,58px);gap:5px}.dpad button{height:52px;background:#1b1b42;border:1px solid #393978;color:#fff;border-radius:12px;font-size:20px}.blank{visibility:hidden}
.ws{display:grid;gap:2px}.ws button{width:clamp(27px,7vw,42px);height:clamp(27px,7vw,42px);border:1px solid #32326e;background:#171738;color:#fff;border-radius:6px;font-weight:900}.ws button.sel{background:#604db7}.ws button.found{background:#1f7447}.words{display:flex;gap:6px;flex-wrap:wrap;justify-content:center}.word{padding:6px 9px;border-radius:999px;background:#1b1b3c;border:1px solid #343475;font-size:11px}.word.done{text-decoration:line-through;color:var(--green)}
.master{display:flex;gap:8px;justify-content:center;flex-wrap:wrap}.peg{width:58px;height:58px;border-radius:50%;border:2px solid #4c4c8d;background:#21214b;color:#fff;font-weight:900}.history{width:min(500px,100%);display:flex;flex-direction:column;gap:5px;max-height:220px;overflow:auto}.hist{display:flex;justify-content:space-between;background:#171735;padding:8px;border-radius:9px;font-size:12px}
.inputline{display:flex;gap:7px;flex-wrap:wrap;justify-content:center}.inputline input{background:#0b0b1c;border:1px solid #393975;color:#fff;border-radius:12px;padding:12px;text-align:center;min-width:140px;outline:none}.inputline input:focus{border-color:var(--cyan)}
.dice{font-size:80px}.kbd{color:#9ba2c8;font-size:11px;text-align:center}.toast{position:fixed;left:50%;bottom:20px;transform:translateX(-50%) translateY(20px);background:#15152f;border:1px solid #42428a;color:#fff;padding:10px 14px;border-radius:12px;opacity:0;pointer-events:none;transition:.2s;z-index:50}.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
@media(max-width:820px){.game-shell{grid-template-columns:1fr}.side{display:grid;grid-template-columns:1fr auto;gap:8px}.side .scorebox{margin:0;min-width:170px}.stage{min-height:560px}.game-area{min-height:430px}}
@media(max-width:520px){.app{padding:8px}.mode-strip{grid-template-columns:1fr}.grid{grid-template-columns:repeat(2,1fr)}.card{min-height:156px}.choices{grid-template-columns:1fr}.side{display:block}.side .scorebox{margin-top:10px}.stage{padding:8px}.checkers{width:100%}.sq{min-width:0}.rps button{width:86px;height:86px}.game-area{min-height:410px}}
</style>
<style id="my-game-app-shell">:root{--mg-bg:#080b14;--mg-panel:#111827;--mg-panel2:#172033;--mg-line:#263247;--mg-accent:#7c5cff;--mg-accent2:#21d4fd;--mg-text:#f5f7ff;--mg-muted:#8e9ab0;--mg-radius:18px;--mg-shadow:0 18px 55px rgba(0,0,0,.32)}html,body{background:var(--mg-bg)}body{font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}body:before{content:"";position:fixed;inset:0;pointer-events:none;background:radial-gradient(circle at 15% 0%,rgba(124,92,255,.18),transparent 35%),radial-gradient(circle at 100% 20%,rgba(33,212,253,.10),transparent 30%)}.game-wrapper{max-width:720px;padding:12px 12px 18px;gap:12px}.top-bar{justify-content:space-between;gap:10px;background:rgba(17,24,39,.82);border:1px solid var(--mg-line);border-radius:var(--mg-radius);padding:10px 12px;box-shadow:var(--mg-shadow);backdrop-filter:blur(16px)}.title{font-size:clamp(21px,6vw,30px);letter-spacing:.2px;text-transform:none;text-shadow:none;color:var(--mg-text);display:flex;align-items:center;gap:9px}.mode-btns{display:flex;background:#0b1020;border:1px solid var(--mg-line);padding:4px;border-radius:14px}.mode-btn{border:0;background:transparent;color:var(--mg-muted);border-radius:10px;padding:8px 11px;min-height:38px}.mode-btn.active{background:linear-gradient(135deg,var(--mg-accent),#5b7cff);color:white;border:0;box-shadow:0 7px 20px rgba(124,92,255,.3)}.hud-bar{background:rgba(17,24,39,.72);border:1px solid var(--mg-line);border-radius:16px;padding:8px}.health-wrap,.status-display{background:#0b1020;border-color:var(--mg-line)}.canvas-wrap{border-color:var(--mg-line);border-radius:18px;box-shadow:var(--mg-shadow)}.controls-dpad{padding:4px 0}.dpad-btn{background:linear-gradient(145deg,#172033,#0f1625);border-color:#2b3850;border-radius:15px;box-shadow:0 7px 16px rgba(0,0,0,.25)}.dpad-btn:active{background:#202d45;border-color:var(--mg-accent2);color:white}.footer{padding:4px}.reset-btn{background:#111a2b;border-color:var(--mg-line);border-radius:12px}.mg-icon{display:inline-flex;width:1.05em;height:1.05em;vertical-align:-.16em;align-items:center;justify-content:center}.mg-icon svg{width:100%;height:100%;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}@media(max-width:600px){.game-wrapper{max-width:100%;padding:8px 8px 12px}.top-bar{position:relative}.title{font-size:22px}.mode-btn{padding:7px 8px;font-size:11px}canvas{max-height:46vh}}</style></head>
<body>
<div class="app">
<div class="header">
<div class="brand"><div class="logo"><span class="mg-icon" aria-hidden="true"><svg viewBox="0 0 24 24"><path d="M7 9h10a5 5 0 0 1 4.7 6.8l-1.2 3.1a2 2 0 0 1-3.5.4l-1.6-2.3H8.6L7 19.3a2 2 0 0 1-3.5-.4l-1.2-3.1A5 5 0 0 1 7 9Z"/><path d="M8 12v4M6 14h4M16.5 13.5h.01M19 16h.01"/></svg></span></div><div><h1>My game</h1><p>50 minijuegos · CPU · 2 jugadores · pensamiento</p></div></div>
<div class="head-actions"><button class="btn" id="homeBtn">🏠 Menú</button><button class="btn" id="randomBtn">🎲 Aleatorio</button></div>
</div>
<section id="menuScreen" class="screen active">
<div class="hero"><h2>Elige tu reto 🧠⚡</h2><p>Juegos clásicos, lógica, cálculo, memoria, estrategia y reflejos en una sola web. El modo se mantiene al cambiar de juego.</p><div class="mode-strip" id="modeStrip"><button class="mode" data-mode="cpu"><span class="mg-icon" aria-hidden="true"><svg viewBox="0 0 24 24"><rect x="5" y="7" width="14" height="12" rx="3"/><path d="M9 11h.01M15 11h.01M9 15h6M12 3v4M8 19v2M16 19v2"/></svg></span> Solo CPU<br><small>La CPU juega</small></button><button class="mode active" data-mode="human"><span class="mg-icon" aria-hidden="true"><svg viewBox="0 0 24 24"><circle cx="9" cy="9" r="3"/><circle cx="16.5" cy="10" r="2.5"/><path d="M3.5 20a5.5 5.5 0 0 1 11 0M14 16a5 5 0 0 1 6.5 4"/></svg></span> Vs humano<br><small>2 usuarios</small></button><button class="mode" data-mode="vscpu"><span class="mg-icon" aria-hidden="true"><svg viewBox="0 0 24 24"><path d="m5 4 15 15M19 4 4 19M7 3l2 2M17 21l-2-2"/></svg></span> Vs CPU<br><small>1 humano + CPU</small></button></div></div>
<div class="tools"><input class="search" id="search" placeholder="Buscar juego..."><div class="filters" id="filters"></div></div>
<div class="grid" id="gameGrid"></div>
</section>
<section id="gameScreen" class="screen">
<div class="game-shell">
<aside class="side"><div><div class="tag" id="gameCat"></div><h2 id="gameTitle"></h2><p id="gameDesc"></p></div><div class="scorebox"><div class="score"><b id="score1">0</b><span id="label1">Jugador 1</span></div><div class="score"><b id="score2">0</b><span id="label2">Jugador 2</span></div></div></aside>
<main class="stage"><div class="stage-head"><span class="status" id="status">Listo</span><div><button class="btn" id="restartBtn"><span class="mg-icon" aria-hidden="true"><svg viewBox="0 0 24 24"><path d="M20 7v5h-5M4 17v-5h5M19.5 12A7.5 7.5 0 0 0 6.8 6.2L5 8M4.5 12a7.5 7.5 0 0 0 12.7 5.8L19 16"/></svg></span> Reiniciar</button></div></div><div class="game-area" id="gameArea"></div></main>
</div>
</section>
</div>
<div class="toast" id="toast"></div>
<script>
(()=>{
const games=[
['maze','🌀','Laberinto','Arcade','Llega a la meta antes que tu rival.','maze'],
['wordsearch','🔤','Sopa de letras','Palabras','Encuentra las palabras ocultas.','wordsearch'],

['rps','✊','Piedra papel o tijera','Arcade','Gana rondas leyendo a tu rival.','rps'],
['connect4','🟡','Conecta 4','Estrategia','Conecta cuatro fichas antes que el rival.','connect4'],
['nim','🪨','Nim','Estrategia','Retira 1, 2 o 3 piedras; quien toma la última gana.','nim'],

['lights','💡','Lights Out','Lógica','Apaga todas las luces con el menor número de movimientos.','lights'],
['mines','💣','Buscaminas duelo','Lógica','Abre casillas, evita minas y suma puntos.','mines'],

['mastermind','🎯','Mastermind','Lógica','Descifra el código secreto de cuatro dígitos.','mastermind'],

['higher','📈','Mayor o menor','Números','Predice si el siguiente valor será mayor o menor.','higher'],
['dice','🎲','Duelo de dados','Arcade','Tira dados y suma victorias.','dice'],
['calc','➕','Cálculo relámpago','Cálculo','Operaciones mentales contra reloj.','quiz'],
['mult','✖️','Multiplicación turbo','Cálculo','Multiplicaciones rápidas.','quiz'],
['division','➗','División exacta','Cálculo','Resuelve divisiones sin calculadora.','quiz'],
['fractions','½','Fracciones','Cálculo','Compara y calcula fracciones.','quiz'],
['percent','%','Porcentajes','Cálculo','Calcula porcentajes mentalmente.','quiz'],

['primes','🧮','Primo o compuesto','Cálculo','Decide si un número es primo.','quiz'],

['odd','👁️','El intruso','Pensamiento','Encuentra el elemento que no pertenece.','quiz'],

['binary','💻','Binario','Cálculo','Convierte números entre decimal y binario.','quiz'],
['roman','🏛️','Números romanos','Cálculo','Convierte entre romanos y decimales.','quiz'],
['money','💵','Cambio exacto','Cálculo','Calcula cuánto cambio corresponde.','quiz'],

['geometry','📐','Geometría mental','Cálculo','Perímetros, áreas y ángulos básicos.','quiz'],
['probability','🎰','Probabilidad','Pensamiento','Razona probabilidades sencillas.','quiz'],
['coordinates','🧭','Coordenadas','Pensamiento','Identifica cuadrantes y posiciones.','quiz'],
['wordmath','📝','Problemas escritos','Pensamiento','Interpreta datos y calcula la respuesta.','quiz'],
['analogies','🔗','Analogías','Palabras','Relaciona conceptos correctamente.','quiz'],
['synonyms','🗣️','Sinónimos','Palabras','Elige la palabra de significado más cercano.','quiz'],
['antonyms','↔️','Antónimos','Palabras','Encuentra el significado opuesto.','quiz'],
['spelling','✍️','Ortografía','Palabras','Elige la escritura correcta.','quiz'],

['streak','🔥','Racha matemática','Cálculo','Mantén una racha de respuestas correctas.','quiz'],
['mental','🧠','Memoria numérica','Memoria','Recuerda el número mostrado.','quiz'],
['stroop','🌈','Stroop','Reflejos','Responde al color, no a la palabra.','quiz'],
['reaction','⚡','Reacción lógica','Reflejos','Responde rápido a una regla cambiante.','quiz'],
['estimate','📏','Estimación','Pensamiento','Elige la aproximación más razonable.','quiz'],
['critical','🧩','Pensamiento crítico','Pensamiento','Detecta conclusiones válidas y errores de razonamiento.','quiz'],
['codebreaker','🔐','Rompe código','Pensamiento','Deduce resultados a partir de pistas cortas.','quiz']

const $=s=>document.querySelector(s), area=$('#gameArea'),grid=$('#gameGrid'),statusEl=$('#status'),score1=$('#score1'),score2=$('#score2'),label1=$('#label1'),label2=$('#label2'),toastEl=$('#toast');
let mode='human',current=null,state={},timers=[],filter='Todos';
const cats=['Todos',...new Set(games.map(g=>g.cat))];

$('#homeBtn').onclick=home;$('#randomBtn').onclick=()=>openGame(games[Math.floor(Math.random()*games.length)].id);$('#restartBtn').onclick=restart;$('#search').oninput=renderMenu;document.querySelectorAll('.mode').forEach(b=>b.onclick=()=>setMode(b.dataset.mode));renderFilters();renderMenu();updateLabels();
})();
